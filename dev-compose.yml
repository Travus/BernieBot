services:
  bot:
    build: ../Travus_Bot_Base
    depends_on:
      - postgres
    volumes:
      - ./config.yml:/usr/src/app/config.yml
      - ./modules/moderation.py:/usr/src/app/modules/moderation.py
      - ./modules/special.py:/usr/src/app/modules/special.py
      - ./modules/utils.py:/usr/src/app/modules/utils.py

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: discord_bot
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  database:
    external: false
